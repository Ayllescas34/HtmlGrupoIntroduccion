<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <title>Integrantes</title>
    <link rel="stylesheet" href="/css/integrantes.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css">
</head>
<body>

    <header class="header">

        <div class="menu container">
            <a href="#">
                <img src="/attachments/logoUmg.png" alt="Logo" class="logo" />
            </a>
            <input type="checkbox" id="menu"/>
            <label for="menu">
                <img src="/attachments/logoUmg.png" class="menu-icono" alt="">
            </label>
            <nav class="navbar">
                <ul>
                    <li><a href="/html/index.html">Inicio</a></li>
                </ul>
            </nav>
        </div>
        

    </header >

    <div class="containter swiper">
        <p class="titulo-integrantes">Integrantes</p>
        <div class="slider-wrapper">

            <div class="card-list swiper-wrapper">

                <div class="card-item swiper-slide">
                    <img src="/attachments/fotoDanny.jpg" alt="integrante" class="user-image">
                    <h2 class="user-name">Danny Paniagua</h2>
                    <p class="user-profession">Estudientes Ingeniería en sistemas</p>
                </div>

                <div class="card-item swiper-slide">
                    <img src="/attachments/fotoXebas.png" alt="integrante" class="user-image">
                    <h2 class="user-name">Xebastian Melgar</h2>
                    <p class="user-profession">Estudientes Ingeniería en sistemas</p>
                </div>

                <div class="card-item swiper-slide">
                    <img src="/attachments/fotoMarin.png" alt="integrante" class="user-image">
                    <h2 class="user-name">José Marín</h2>
                    <p class="user-profession">Estudientes Ingeniería en sistemas</p>
                </div>

                <div class="card-item swiper-slide">
                    <img src="/attachments/fotoAlejandro.png" alt="integrante" class="user-image">
                    <h2 class="user-name">Alejandro Flores</h2>
                    <p class="user-profession">Estudientes Ingeniería en sistemas</p>
                </div>

            </div>

            <div class="swiper-pagination"></div>
            <div class="swiper-button-prev"></div>
            <div class="swiper-button-next"></div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

    <script src="/script/integrantes.js"></script>
</body>
</html>
